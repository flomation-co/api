include:
  - project: 'flomation/infrastructure/ci-templates'
    ref: main
    file: '.gitlab-ci-templates.yml'

stages:
  - prepare
  - security-scan
  - test
  - build
  - docs
  - rpm-publish
  - deb-publish
  - publish
  - sync
  - docker
  - Development
  - Sandbox
  - test-suite
  - Production

variables:
  VERSION: 1.0.${CI_PIPELINE_IID}
  NAME: api
  AWS_ACCESS_KEY_ID: ${GITLAB_AWS_USER_KEY}
  AWS_SECRET_ACCESS_KEY: ${GITLAB_AWS_USER_SECRET}
  AWS_DEFAULT_REGION: eu-west-2
  DEPLOY_BUCKET: ${AWS_DEPLOYMENT_BUCKET}
  CI_TEMPLATES_PROJECT: flomation/infrastructure/ci-templates

inject-metadata:
  extends: .inject-metadata-template

migration-check:
  stage: prepare
  needs: []
  # Loads the embedded migration set exactly as the service does on boot
  # (iofs.New), before any DB. Fails the pipeline on a duplicate version or a
  # malformed filename — the boot-breaker that a duplicate 120 caused in prod
  # on 13/07/2026. Runs on EVERY pipeline (no only:) so it blocks the MR, and
  # in prepare (the first stage) so it runs before any build or deploy.
  script:
    # 1. the embedded set loads (duplicate/malformed within THIS branch)
    - go test ./internal/persistence/ -run TestMigrationsSourceLoads -v
    # 2. no version number collides with the target branch it will merge into —
    #    the cross-branch case the in-isolation test above cannot see (see the
    #    script header; this is what took main down on 14/07/2026).
    - sh ci/check-migration-collision.sh

lint:
  stage: prepare
  variables:
    # More CPU for the lint/security suite — go build, golangci-lint and the
    # gosec compile are all multi-threaded (GOMAXPROCS). Requires the runner's
    # config.toml to permit cpu_*_overwrite_max_allowed, else these are ignored.
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "4"
    # govulncheck loads the whole module dependency graph into memory to trace
    # call paths; as the AWS SDK surface grew (adding service/s3 pulled a larger
    # transitive graph) it OOM-killed (exit 137) at the runner's 4Gi ceiling.
    # Pin memory to that ceiling — the runner REJECTS a request above 4Gi, so this
    # is the hard maximum available without runner config.toml access. Crucially
    # GOMEMLIMIT bounds only the Go HEAP, not total RSS — govulncheck holds a large
    # OFF-heap footprint (mmap'd package export data, SSA), so a heap limit alone
    # cannot keep total RSS under the cap.
    #
    # These values are the GOLANGCI-LINT budget. govulncheck now sets its own,
    # tighter GOMAXPROCS/GOMEMLIMIT per command in the Makefile, because the two
    # tools want opposite things and a single job-wide value cannot serve both:
    # GOMAXPROCS=1 fixed the govulncheck OOM but starved golangci-lint's parallel
    # package loading into a timeout, so the job compromised on 2 and govulncheck
    # kept dying. Splitting them removes the compromise — see the Makefile.
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    GOMEMLIMIT: "2800MiB"
    GOMAXPROCS: "2"
    # Only GOBIN moves into the build dir, because GitLab's cache cannot reach
    # outside it and the goal is to stop re-installing the pinned tools.
    #
    # GOPATH/GOMODCACHE deliberately stay at their defaults. Relocating the
    # module cache under CI_PROJECT_DIR does cache more, but it also puts a few
    # hundred thousand third-party .go files inside the tree the linters walk:
    # `goimports -l .` and golangci-lint then analyse the whole dependency
    # source and fail the job on other people's formatting. Caching the two tool
    # binaries is the part that matters — ensure_tool skips `go install`
    # entirely when they are already present at the pinned version, so a warm
    # run downloads nothing.
    GOBIN: "$CI_PROJECT_DIR/.gocache/bin"
  # Keyed on the Makefile, which is where the pinned versions live, so bumping a
  # version invalidates the cache rather than leaving a stale binary behind.
  cache:
    key:
      files:
        - Makefile
    paths:
      - .gocache/bin
  # PATH is extended in script rather than before_script, so this cannot
  # override a default before_script coming from the shared CI template.
  script:
    - export PATH="$GOBIN:$PATH"
    - make lint

# Runs security-scan.sh --install on the pre-baked flomationco/security-scanner
# image. Advisory for now (allow_failure inherited from the template), so
# findings surface without blocking the pipeline. needs: [] lets it start
# immediately since it only scans the source tree.
# NOTE: the scanner image is private — a group-level DOCKER_AUTH_CONFIG CI/CD
# variable is required so GitLab can authenticate the image pull.
security-scan:
  extends: .security-scan-template
  variables:
    CI_TEMPLATES_REF: "main"
  needs: []

compile:
  stage: build
  variables:
    # Build parallelism is deliberately capped to keep peak compiler memory under
    # the runner's cgroup limit. As the OCI/AWS/Azure SDK surface grew (each new
    # provider node pulls a larger transitive package graph), the compile job began
    # OOM-killing (exit 137) at JOBS=4 — four parallel per-platform cross-compiles,
    # each loading the whole package tree, plus Go's default package parallelism.
    # This job set no memory request, so it ran on the runner's default (well under
    # 4Gi). JOBS=2 halves the concurrent cross-compiles and GOMAXPROCS=2 caps Go's
    # per-build package concurrency (go build -p defaults to GOMAXPROCS), cutting
    # peak memory ~4x; GOMAXPROCS (not GOFLAGS=-p) so it stays valid for `go mod`
    # subcommands too. The runner rejects any MemoryRequest above 4Gi ("higher than
    # limit allowed 4Gi"), so we pin request=limit=4Gi to guarantee the full
    # allowance rather than the lower default the growing build would blow past.
    # JOBS is pinned (not $(nproc)) because nproc does not reliably reflect a k8s
    # CFS CPU limit. Requires the runner's config.toml to permit
    # cpu_*_overwrite_max_allowed / the memory overwrite, else these are ignored.
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    JOBS: "2"
    GOMAXPROCS: "2"
  script:
    - make build
  artifacts:
    paths:
#      - ./build.zip
      - ./dist/flomation*
    expire_in: 1 hour
  cache:
    policy: push
    paths:
      - ./build.zip

generate-docs:
  extends: .generate-docs-template
  only:
    - main
  when: manual
  variables:
    DOCS_SOURCE_FILE: internal/config/config.go
    DOCS_COMPONENT_NAME: ${NAME}
    CI_TEMPLATES_REF: main
  artifacts:
    name: "${NAME}-docs-${VERSION}"
    paths:
      - docs/
    expire_in: 30 days

build-rpm-8:
  extends: .build-rpm-template
  only:
    - main
  when: manual
  variables:
    EL_VERSION: "8"
    CI_TEMPLATES_REF: "main"
    APPLICATION_BINARY: "${PACKAGE_NAME}-amd64-linux*"
    ARCH: x86_64
  needs:
    - inject-metadata
    - compile
  artifacts:
    paths:
      - ${PACKAGE_NAME}-*el8.*.rpm
    expire_in: 30 days


    DOCS_S3_PATH: docs/flomation/config
    PUBLISH_BUCKET: ${AWS_PACKAGE_BUCKET_LIVE}
  needs:
    - generate-docs

Deploy to DEV:
  stage: Development
  variables:
    ENVIRONMENT: dev
  only:
    - main
  script:
    - aws s3 cp s3://${DEPLOY_BUCKET}/deploy-application-aws.sh .
    - chmod +x deploy-application-aws.sh
    - ENVIRONMENT=${ENVIRONMENT} APPLICATION=${NAME} ./deploy-application-aws.sh

Deploy to Sandbox:
  stage: Sandbox
  variables:
    OVH_HOST: "79.137.102.79"
    PACKAGE: "flomation-${NAME}"
    SERVICE: "flomation-${NAME}"
  only:
    - main
  script:
    - mkdir -p ~/.ssh && echo "${OVH_DEPLOY_KEY}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh -o StrictHostKeyChecking=no ubuntu@${OVH_HOST} "sudo apt update && sudo apt install -y ${PACKAGE} && sudo systemctl reset-failed ${SERVICE} && sudo systemctl restart ${SERVICE}"

Deploy to Live (AWS):
  stage: Production
  when: manual
  variables:
    ENVIRONMENT: live
  only:
    - main
  script:
    - aws s3 cp s3://${DEPLOY_BUCKET}/deploy-application-aws.sh .
    - chmod +x deploy-application-aws.sh
    - ENVIRONMENT=${ENVIRONMENT} APPLICATION=${NAME} ./deploy-application-aws.sh

Deploy to Live:
  stage: Production
  variables:
    OVH_HOST: "${OVH_LIVE_HOST}"
    PACKAGE: "flomation-${NAME}"
    SERVICE: "flomation-${NAME}"
  only:
    - main
  when: manual
  script:
    - mkdir -p ~/.ssh && echo "${OVH_LIVE_DEPLOY_KEY}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh -o StrictHostKeyChecking=no ubuntu@${OVH_HOST} "sudo apt update && sudo apt install -y ${PACKAGE} && sudo systemctl reset-failed ${SERVICE} && sudo systemctl restart ${SERVICE}"

test-suite:
  extends: .test-suite-template
  only:
    - main
  needs:
    - inject-metadata
    - compile
    - "Deploy to DEV"

sync-to-github:
  extends: .sync-to-github-template
  variables:
    GIT_DEPTH: 0
  only:
    - main